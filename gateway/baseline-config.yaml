# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Benchmark control: identical ingress authentication and MCP routing to the
# evaluated gateway, but deliberately no mandate/PDP guardrail processor.
binds:
- port: 3000
  listeners:
  - routes:
    - matches:
      - path:
          exact: /mcp
      policies:
        # Identical to the evaluated gateway so the benchmark difference is
        # only the mandate read and the AuthZEN decision.
        requestHeaderModifier:
          set:
            x-gateway-caller: synthetic-gateway-to-tool-caller-token
        mcpAuthentication:
          mode: strict
          issuer: http://keycloak:8080/realms/acp
          audiences: [agent-control-plane]
          jwks:
            url: http://keycloak:8080/realms/acp/protocol/openid-connect/certs
          resourceMetadata:
            resource: http://localhost:3002/mcp
            scopesSupported: [openid]
            bearerMethodsSupported: [header]
      backends:
      - mcp:
          targets:
          - name: travel-tool
            mcp:
              host: http://travel-tool:8000/mcp
